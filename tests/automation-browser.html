<style>body{margin:0;padding:104px 24px 80px;font:14px/1.5 system-ui;background:#1e1f22;color:#dbdee1}.fixture-header{position:fixed;top:32px;left:0;right:0;height:50px;padding-left:24px;display:flex;align-items:center;background:#17181b}main{max-width:800px;margin:auto}section.fixture-search,pre{padding:12px;background:#17181b;margin-bottom:12px;border-radius:8px}button{cursor:pointer}pre{white-space:pre-wrap}#fixture-pagination{position:fixed;bottom:0;right:0;width:400px;padding:16px;background:#17181b}</style></head><body><header class="fixture-header"># muzyka · test</header><main>

<script>
window.module={exports:{}};
const parameters=new URLSearchParams(location.search),scenario=parameters.get("scenario")||"normal";

const filters={...(scenario==="foreign"?{}:{channel_id:[channelID]}),sort_by:"timestamp",sort_order:"asc"},props={searchContext:{type:"GUILD",guildId:guildID},search:{},messages:[],searchResultsQuery:filters,searchMode:"oldest",blockCount:0,ignoreCount:0};
const pagination={currentPage:scenario==="resume"?19:scenario==="foreign"?6:1,pageSize:size,totalCount:total};
const root=document.querySelector("[data-ytlc-search]"),next=root.querySelector('[rel="next"]'),prev=root.querySelector('[rel="prev"]');

const staleProps={...props,search:{offset:999,totalResults:19},searchResultsQuery:{content:"old"}},oldParent={memoizedProps:staleProps},parent={memoizedProps:props},oldRoot={stateNode:{}},currentRoot={};
oldRoot.alternate=currentRoot;currentRoot.alternate=oldRoot;currentRoot.stateNode=oldRoot.stateNode;oldRoot.stateNode.current=currentRoot;oldRoot.child=oldParent;currentRoot.child=parent;oldParent.alternate=parent;parent.alternate=oldParent;oldParent.return=oldRoot;parent.return=currentRoot;
const fiber={memoizedProps:{},return:oldParent},buttonFiber={memoizedProps:{},return:{memoizedProps:pagination}};fiber.alternate={memoizedProps:{},return:oldParent};fiber.alternate.alternate=fiber;oldParent.child=parent.child=fiber;
const realm=document.createElement("iframe");realm.hidden=true;document.body.append(realm);props.searchResultsQuery=realm.contentWindow.JSON.parse(JSON.stringify(filters));
let offset=(pagination.currentPage-1)*size,loading=false;
function show(page,partial=false,stale=false){pagination.currentPage=page+1;offset=page*size;loading=partial;props.search={offset,totalResults:partial?0:total,isSearching:partial};if(!stale)props.messages=messages.slice(offset,offset+(partial?2:size));next.disabled=page===Math.ceil(total/size)-1;prev.disabled=page===0;
 document.getElementById("fixture-page").textContent=`${page+1}/${Math.ceil(total/size)}${partial?" • ładowanie":""}`;
 document.getElementById("fixture-messages").replaceChildren(...props.messages.map(m=>{const d=document.createElement("div");d.id=`message-content-${m.id}`;d.textContent=m.content;return d;}));}
show(pagination.currentPage-1);
root.append(Object.assign(document.createElement("div"),{className:"embed loading_spinnerWrapper"}));root.lastChild.setAttribute("aria-busy","true");root.lastChild.setAttribute("role","progressbar");
const stores={SelectedChannelStore:{getChannelId:()=>channelID},ChannelStore:{getChannel:()=>({id:channelID,guild_id:guildID,name:"muzyka",type:0})},GuildStore:{getGuild:()=>({name:"Serwer testowy"})},PermissionStore:{can:()=>true},MessageStore:{getMessages:()=>({_array:[]})},SearchQueryStore:{getSearchResultsQueryString:()=>"in:muzyka youtube.com",getSearchResultsQuery:()=>filters,getSearchResultsOffset:()=>offset,getSearchMode:()=>"oldest"},SelectedSearchContextStore:{getSelectedSearchContext:()=>props.searchContext},SearchMessageStore:{getIsFetching:()=>loading,getIsIndexing:()=>false,getIsHistoricalIndexing:()=>true,getTotalCount:()=>loading?0:total,getMessage:id=>messages.find(m=>m.id===id)}};

</script><script src="/plugin.js"></script><script>
const Plugin=module.exports,plugin=new Plugin();plugin.start();plugin.selectChannel();
if(scenario==="reenable"){plugin.renderSoon();plugin.stop();plugin.start();}
plugin.collection.state.config.pageDelayMinSeconds=0;plugin.collection.state.config.pageDelayMaxSeconds=0;document.getElementById("mount").append(plugin.getSettingsPanel());
let resumeClicks=0,pauseClicks=0,clicksAtResume=0,resumePage=null;
if(["resume","foreign"].includes(scenario)){
 const tracker=new Plugin.Core.SearchTracker(plugin.collection);
 const completed=scenario==="resume"?18:5;
 for(let page=0;page<completed;page++){show(page);const search=plugin.adapter.inspectSearch(plugin.collection.state.selection);for(const message of search.messages)plugin.collection.process(message);tracker.commit(search);}
 show(completed);plugin.collection.state.checkpoint.runMode="auto";tracker.active().navigation={phase:"interrupted",fromPage:completed,expectedPage:completed+1,direction:"next",updatedAt:new Date().toISOString()};plugin.collection.fail(Error(`Syntetyczny timeout na stronie ${completed+1}`));plugin.dirty=true;plugin.save();
 const panel=[...plugin.panels][0];panel.collectAll.addEventListener("click",()=>{resumeClicks++;clicksAtResume=clicks.length;resumePage=pagination.currentPage;});panel.pause.addEventListener("click",()=>pauseClicks++);
}
if(scenario==="missing"){
 const getMessage=stores.SearchMessageStore.getMessage;stores.SearchMessageStore.getMessage=id=>id===messages[24].id?null:getMessage(id);
 props.messages=[...messages.slice(0,24),{id:messages[24].id}];
 plugin.collection.state.config.pageLoadTimeoutSeconds=15;plugin.collection.fail(Error("Timeout odczytu: rozpoznano 24/25 wyników. Dane zachowane."));plugin.renderSoon();
}
if(scenario==="summary"){plugin.collection.fail(Error("Wyniki zmieniły się przed kliknięciem. Nie wykonano przejścia."));plugin.collection.interrupt();plugin.renderSoon();}
if(scenario==="summary"){
 const controls=document.createElement("p");controls.id="summary-controls";
 for(const [text,action] of [["Testuj bieżący błąd",()=>plugin.collection.fail(Error("Test bieżącego błędu"))],["Odtwórz zapis w teście",()=>{plugin.collection=new Plugin.Core.Persistence(plugin.api.Data).load();plugin.autoFinished=false;} ]]){
  const control=document.createElement("button");control.textContent=text;control.addEventListener("click",()=>{if(plugin.running)return;action();plugin.renderSoon();});controls.append(control);
 }
 document.getElementById("test-report").after(controls);
}
function check(name,condition){if(!condition)throw Error(name);checks.push(`PASS ${name}`);}
for(const [button,direction] of [[next,"next"],[prev,"prev"]])button.addEventListener("click",()=>{
 const pointer=values.get("checkpoint"),checkpoint=JSON.parse(values.get("state-"+pointer.slot).payload),scope=checkpoint.searchTracking.scopes.find(s=>s.key===checkpoint.searchTracking.activeKey);
 check("Zapis przetworzonej strony przed istniejącą akcją UI",scope.pages.some(p=>p.number===pagination.currentPage&&p.status==="processed"));
 check("Zapis kierunku i oczekiwanej strony",scope.navigation.direction===direction&&scope.navigation.expectedPage===pagination.currentPage+(direction==="next"?1:-1));
 clicks.push(direction);const page=pagination.currentPage+(direction==="next"?0:-2);
 if(scenario==="timeout"){show(page,false,true);return;}
 show(page,true);setTimeout(()=>show(page,false),scenario==="stop"?5000:400);
});
let started=false,done=false,stoppedAt=null,uiFinishAt=null;
const report=document.getElementById("test-report");
const monitor=setInterval(()=>{try{
 if(plugin.running)started=true;
 if(!started||done)return;
 report.textContent=`Scenariusz: ${scenario}\nKliknięcia: ${clicks.join(", ")||"brak"}\nStan: ${plugin.collection.state.status}\nLinki: ${plugin.collection.records.size}\n${scenario==="stop"?"Po pierwszym kliknięciu wybierz Stop.":"Oczekiwanie na wynik testu…"}`;
 if(scenario==="foreign"&&plugin.autoFinished&&savedFiles.has("/memory/automatic.txt")){
  const a=new Plugin.Core.SearchTracker(plugin.collection).accounting();
  check("Strona 6 z 24+1 wynikami i strona 7 spoza kanału zostały rozpoznane",a.allPages&&a.reviewed===175&&a.outsideChannel===26&&a.read===149);
  check("Dokładnie jedno Next, bez cofania",clicks.join(",")==="next");
  check("Kolekcja i TXT zawierają tylko 149 linków wybranego kanału",plugin.collection.records.size===149&&savedFiles.get("/memory/automatic.txt").trim().split(/\r?\n/).length===149);
  check("Wyniki spoza kanału nie są nieodczytane ani bez linków",a.unverified===0&&a.withoutLinks===0);
  check("Checkpoint przechowuje wyłączenia po ponownym odczycie",new Plugin.Core.SearchTracker(new Plugin.Core.Persistence(plugin.api.Data).load()).accounting().outsideChannel===26);
  done=true;
 }else if(["normal","reenable"].includes(scenario)&&plugin.autoFinished&&savedFiles.has("/memory/automatic.txt")){
  if(scenario==="reenable"){
   const panel=[...plugin.panels][0],ready=panel.progress.textContent.includes("3/3")&&panel.tabs.links.textContent.includes("19")&&panel.status.textContent.includes("zakończony");
   uiFinishAt??=Date.now();if(!ready){if(Date.now()-uiFinishAt>5000)throw Error("Panel nie odświeżył się w ciągu 5 s od zakończenia");return;}
  }
  check("Przejście do końca bez niezamierzonego cofania",clicks.join(",")==="next,next");
  check("Bailout React i filtry z iframe pozostają zgodne",plugin.adapter.searchDiagnostics.coherent===true&&plugin.adapter.searchDiagnostics.coherenceReason===null);
  check("Wszystkie 19 wystąpień bez dubli od powrotu",plugin.collection.records.size===19);
  check("Wszystkie trzy strony przetworzone",new Plugin.Core.SearchTracker(plugin.collection).summary().processed===3);
  check("Automatyczny TXT obejmuje pełną kolekcję",savedFiles.get("/memory/automatic.txt").trim().split("\r\n").length===19);
  check("Koniec zatrzymuje nawigację",!plugin.running&&!plugin.navigator);
  check("Pełna historia nie jest deklarowana",plugin.collection.state.completeness.status!=="complete");done=true;
  if(scenario==="reenable"){
   const panel=[...plugin.panels][0];check("Panel po wyłącz/włącz odświeżył postęp i licznik",panel.progress.textContent.includes("3/3")&&panel.tabs.links.textContent.includes("19")&&panel.status.textContent.includes("zakończony"));
  }
 }else if(scenario==="resume"&&pauseClicks>=1&&resumeClicks>=2&&clicks.length>clicksAtResume){
  const panel=[...plugin.panels][0];panel.stop.click();
  check("Wznowienie po błędzie i po Pauzie używa przycisku automatycznego",resumeClicks>=2);
  check("Żadne kliknięcie nie cofa strony",clicks.every(x=>x==="next"));
  check("Wznowienie ponownie odczytało stronę otwartą podczas Pauzy",new Plugin.Core.SearchTracker(plugin.collection).active().pages.some(p=>p.number===resumePage&&p.status==="processed"));
  check("Zachowano pierwsze 18 stron",new Plugin.Core.SearchTracker(plugin.collection).summary().confirmed.includes(1)&&new Plugin.Core.SearchTracker(plugin.collection).summary().confirmed.includes(18));
  check("Checkpoint pamięta tryb automatyczny",new Plugin.Core.Persistence(plugin.api.Data).load().state.checkpoint.runMode==="auto");
  check("Stop wyłącza nawigację i oczekiwanie",!plugin.running&&!plugin.navigator&&!plugin.navigationDelay);done=true;
 }else if(scenario==="summary"&&plugin.autoFinished&&savedFiles.has("/memory/automatic.txt")&&!plugin.renderTimer){

  check("148/148 wiadomości, 121 z linkami i 27 bez linków",a.read===148&&a.withLinks===121&&a.withoutLinks===27&&a.unverified===0&&a.allPages);
  check("121 wystąpień i 117 unikalnych zasobów",plugin.collection.records.size===121&&plugin.collection.resources.size===117);
  check("Wszystkie sześć stron i pięć istniejących kliknięć",clicks.join(",")==="next,next,next,next,next");
  check("Ukończenie wyszukiwania pokazane jako sukces",panel.status.textContent==="Odczyt wyszukiwania zakończony"&&panel.status.dataset.searchFinished==="true");
  check("Wiadomości bez linków wyjaśnione jako sprawdzone",panel.accountingNote.textContent.includes("nie są pominiętymi wynikami"));
  check("Historia błędów oddzielona od bieżącego błędu",panel.notes.querySelector("details summary").textContent.includes("Historia wcześniejszych błędów")&&!panel.notes.querySelector(".ytlc-error"));
  check("Eksport nadal ma niepotwierdzoną pełną historię",plugin.collection.state.completeness.status!=="complete"&&panel.historyNote.textContent.includes("INCOMPLETE"));
  check("Zachowana historia błędów w checkpointcie",new Plugin.Core.Persistence(plugin.api.Data).load().state.errors.length===1);
  done=true;
 }else if(scenario==="delay-stop"&&!plugin.running&&plugin.collection.records.size){

  check("Przerwa i timer odliczania anulowane",!plugin.navigationDelay&&!plugin.busy);
  check("Checkpoint zachowuje siedem linków",JSON.parse(values.get("state-"+values.get("checkpoint").slot).payload).records.length===7);
  check("Zakres 30–30 s zapisany",JSON.parse(values.get("state-"+values.get("checkpoint").slot).payload).config.pageDelayMinSeconds===30&&plugin.collection.state.config.pageDelayMaxSeconds===30);

 }else if(scenario==="stop"&&!plugin.running&&clicks.length){
  if(stoppedAt===null)stoppedAt=Date.now();if(Date.now()-stoppedAt>7000){check("Stop pozostaje zatrzymany mimo opóźnionych wyników",clicks.length===1&&!plugin.navigator);check("Checkpoint Stop zachowuje zebrane linki",new Plugin.Core.Persistence(plugin.api.Data).load().records.size>=7);done=true;}

 }catch(error){clearInterval(monitor);report.dataset.result="fail";report.textContent=`FAIL: ${error.stack}`;}},200);
